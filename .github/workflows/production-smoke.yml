name: Production browser smoke
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: GitHub deployment ID for successful production deployment
        required: true
        type: string
permissions:
  contents: read
  deployments: read
jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve exact successful production deployment
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ github.event.deployment.id || inputs.deployment_id }}
        run: |
          set -euo pipefail
          [[ "$DEPLOYMENT_ID" =~ ^[0-9]+$ ]]
          deployment=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID")
          status=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" --jq '.[0]')
          current=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=Production&per_page=1" --jq '.[0]')
          sha=$(jq -er '.sha' <<< "$deployment")
          url=$(jq -er '.environment_url' <<< "$status")
          current_id=$(jq -er '.id' <<< "$current")
          current_sha=$(jq -er '.sha' <<< "$current")
          [[ "$(jq -r '.environment' <<< "$deployment")" == Production ]]
          [[ "$(jq -r '.state' <<< "$status")" == success ]]
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          [[ "$url" =~ ^https://ai-[a-z0-9-]+\.vercel\.app$ ]]
          [[ "$url" != https://ai-lyart-tau-91.vercel.app && "$url" != https://ai-git-main-dadda3ettaa-4200.vercel.app && "$url" != https://ai-dadda3ettaa-4200.vercel.app ]]
          [[ "$current_id" == "$DEPLOYMENT_ID" ]]
          [[ "$current_sha" == "$sha" ]]
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf 'Before smoke: expected/current deployment %s, expected/current SHA %s, immutable URL %s\n' "$DEPLOYMENT_ID" "$sha" "$url" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Test fresh and returning Arabic guest journeys on desktop and Android
        env:
          RHYTHM_PRODUCTION_SMOKE: '1'
          RHYTHM_EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        run: npx playwright test e2e/production-smoke.spec.ts e2e/first-meal-guest.spec.ts
      - name: Verify production deployment did not change during smoke
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_DEPLOYMENT_ID: ${{ steps.target.outputs.deployment_id }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
          EXPECTED_URL: ${{ steps.target.outputs.url }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=Production&per_page=1" --jq '.[0]')
          actual_id=$(jq -er '.id' <<< "$current")
          actual_sha=$(jq -er '.sha' <<< "$current")
          actual_status=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$actual_id/statuses" --jq '.[0]')
          actual_state=$(jq -er '.state' <<< "$actual_status")
          actual_url=$(jq -er '.environment_url' <<< "$actual_status")
          printf 'After smoke: expected deployment %s / SHA %s / URL %s; actual deployment %s / SHA %s / URL %s; run %s/actions/runs/%s\n' \
            "$EXPECTED_DEPLOYMENT_ID" "$EXPECTED_SHA" "$EXPECTED_URL" \
            "$actual_id" "$actual_sha" "$actual_url" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          [[ "$actual_id" == "$EXPECTED_DEPLOYMENT_ID" ]]
          [[ "$actual_sha" == "$EXPECTED_SHA" ]]
          [[ "$actual_state" == success ]]
          [[ "$actual_url" == "$EXPECTED_URL" ]]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-smoke-report
          path: |
            test-results/
            playwright-report/
          retention-days: 14
