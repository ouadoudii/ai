name: Quality gate and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Arab user quality gate
        run: npm run quality:arab-users

      - name: TypeScript quality gate
        run: npm run lint

      - name: Full unit and integration tests
        run: npm test

      - name: Install Playwright browser
        run: |
          # GitHub's Ubuntu image can include Google's Chrome apt source.
          # Playwright does not need that repository, and transient metadata
          # mismatches there must not block our browser quality gate.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          npx playwright install --with-deps chromium

      - name: Real-browser Arabic visual journeys
        run: npm run test:visual

      - name: Upload browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arab-user-visual-report
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Production build
        run: npm run build
