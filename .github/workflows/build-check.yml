name: Tests, E2E and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  coverage-guard:
    name: Regression coverage guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tests to move with product changes
        if: github.event_name == 'pull_request'
        run: node scripts/verify-regression-coverage.mjs "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}"

      - name: Main push confirmation
        if: github.event_name != 'pull_request'
        run: echo "Coverage guard is enforced before merge on pull requests."

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit and integration tests
        run: npm test

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          npx playwright install --with-deps chromium

      - name: Full Playwright E2E suite
        run: npm run test:e2e

      - name: Upload browser screenshots, videos and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            test-results/
            playwright-report/
            visual-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Production build
    needs: [coverage-guard, tests, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build
