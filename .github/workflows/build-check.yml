name: Quality gate and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Arab user quality gate
        run: npm run quality:arab-users

      - name: Full quality gate
        run: npm run quality:deploy

      - name: Production build
        run: npm run build
