<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moment — الطعام والنوم وإيقاع الحياة اليومية</title>
    <meta name="description" content="يساعدك Moment على تسجيل الطعام والنوم والطاقة والعافية بسهولة، ثم يوضح الأنماط عندما تتكرر فعلاً." />
    <meta property="og:title" content="Moment" />
    <meta property="og:description" content="اكتشف ما يؤثر في إيقاع حياتك اليومية بدون أن تتحول حياتك إلى مشروع للتتبع." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FBFBFA] text-stone-800 antialiased selection:bg-amber-100 selection:text-amber-900 min-h-screen">
    <div id="root">
      <main id="rhythm-boot" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f7f2ea;font-family:system-ui,-apple-system,sans-serif;color:#292524">
        <section style="max-width:520px;width:100%;background:#fff;border:1px solid #e7e5e4;border-radius:24px;padding:28px;box-shadow:0 14px 40px rgba(57,45,35,.08)">
          <div style="font-size:30px;margin-bottom:8px">◌</div>
          <h1 style="font-size:22px;margin:0 0 8px">يتم تحميل Moment…</h1>
          <p id="rhythm-boot-status" style="margin:0;color:#78716c;line-height:1.5">جارٍ تشغيل التطبيق.</p>
        </section>
      </main>
    </div>
    <script>
      window.addEventListener('error', function (event) {
        var status = document.getElementById('rhythm-boot-status');
        if (status) status.textContent = 'خطأ في بدء التشغيل: ' + (event.message || 'خطأ JavaScript غير معروف');
      });
      window.addEventListener('unhandledrejection', function (event) {
        var status = document.getElementById('rhythm-boot-status');
        if (status) status.textContent = 'خطأ في بدء التشغيل: ' + String(event.reason || 'خطأ غير معروف');
      });
      setTimeout(function () {
        var status = document.getElementById('rhythm-boot-status');
        if (status) status.textContent = 'لم يبدأ التطبيق بعد 8 ثوانٍ. ربما تعذر تحميل حزمة JavaScript.';
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
